name: Astra918 branch build

on:
  push:
    branches: [astra918-working]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev pkg-config cmake autoconf automake libtool libclang-dev
      - name: Install Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build embedded web client
        working-directory: crates/sdroxide-web
        run: trunk build --release
      - name: Compile standard SDROXIDE
        run: cargo build --release --locked -p sdroxide --no-default-features --features embed-web,rtl433
